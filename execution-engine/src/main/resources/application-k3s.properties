server.port=8443
server.forward-headers-strategy=none
server.ssl.enabled=true
server.ssl.bundle=engine-transport
server.ssl.client-auth=need
spring.ssl.bundle.pem.engine-transport.reload-on-update=true
spring.ssl.bundle.pem.engine-transport.keystore.certificate=${LOOMSPAN_ENGINE_CERTIFICATE:file:/var/run/loomspan/engine-transport/tls.crt}
spring.ssl.bundle.pem.engine-transport.keystore.private-key=${LOOMSPAN_ENGINE_PRIVATE_KEY:file:/var/run/loomspan/engine-transport/tls.key}
spring.ssl.bundle.pem.engine-transport.truststore.certificate=${LOOMSPAN_ENGINE_TRUST_CERTIFICATE:file:/var/run/loomspan/engine-transport/ca.crt}

loomspan.observability.enabled=true
loomspan.observability.auth.api-key=${LOOMSPAN_CONSOLE_API_KEY}
loomspan.shutdown.timeout=60s
