apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loomspan-milestone-db
  namespace: loomspan-management
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loomspan-milestone-packs
  namespace: loomspan-management
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loomspan-milestone-postgres
  namespace: loomspan-management
spec:
  selector:
    app.kubernetes.io/name: loomspan-milestone-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomspan-milestone-postgres
  namespace: loomspan-management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loomspan-milestone-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loomspan-milestone-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: loomspan
            - name: POSTGRES_DB
              value: milestone
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loomspan-milestone-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/milestone
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "loomspan", "-d", "milestone"]
          volumeMounts:
            - name: db
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: loomspan-milestone-db
