apiVersion: batch/v1
kind: Job
metadata:
  name: loomspan-observation-probe
  namespace: loomspan-management
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loomspan-management-backend
    spec:
      serviceAccountName: loomspan-management-backend
      restartPolicy: Never
      containers:
        - name: observation-probe
          image: loomspan-observation-probe:local
          imagePullPolicy: IfNotPresent
          args: ["-test.run", "^TestK3sEngineObservation$", "-test.v"]
          env:
            - name: LOOMSPAN_CONSOLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loomspan-console
                  key: api-key
          volumeMounts:
            - name: engine-transport
              mountPath: /var/run/loomspan/engine-transport
              readOnly: true
      volumes:
        - name: engine-transport
          secret:
            secretName: management-client-tls
