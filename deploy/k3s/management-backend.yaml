apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomspan-management-backend
  namespace: loomspan-management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loomspan-management-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loomspan-management-backend
    spec:
      serviceAccountName: loomspan-management-backend
      containers:
        - name: management-backend
          image: loomspan-management-backend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: LOOMSPAN_CONSOLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loomspan-console
                  key: api-key
          volumeMounts:
            - name: engine-transport
              mountPath: /var/run/loomspan/engine-transport
              readOnly: true
      volumes:
        - name: engine-transport
          secret:
            secretName: management-client-tls
