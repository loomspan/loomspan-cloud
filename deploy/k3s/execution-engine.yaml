apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomspan-execution-engine
  namespace: loomspan-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loomspan-execution-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loomspan-execution-engine
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      containers:
        - name: execution-engine
          image: loomspan-execution-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k3s
            - name: LOOMSPAN_CONSOLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loomspan-console
                  key: api-key
          volumeMounts:
            - name: engine-transport
              mountPath: /var/run/loomspan/engine-transport
              readOnly: true
      volumes:
        - name: engine-transport
          secret:
            secretName: engine-server-tls
