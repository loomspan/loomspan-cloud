apiVersion: v1
kind: ServiceAccount
metadata:
  name: loomspan-management-backend
  namespace: loomspan-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watch-engine-pods
  namespace: loomspan-engine
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watch-engine-pods
  namespace: loomspan-engine
subjects:
  - kind: ServiceAccount
    name: loomspan-management-backend
    namespace: loomspan-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watch-engine-pods
