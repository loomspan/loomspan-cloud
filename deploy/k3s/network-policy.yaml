apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-engine-ingress
  namespace: loomspan-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loomspan-execution-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loomspan-management
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loomspan-management-backend
      ports:
        - protocol: TCP
          port: 8443
